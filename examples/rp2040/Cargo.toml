[workspace]

[package]
edition = "2021"
name = "rp2040-examples"
version = "0.1.0"
license = "Apache-2.0"
publish = false

[dependencies]
embassy-rp = { version = "0.10.0", features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl", "rp2040"] }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }

defmt = "1.0.1"
defmt-rtt = "1.0.0"

cortex-m = { version = "0.7.6", features = ["inline-asm"] }
cortex-m-rt = { version = "0.7.0", features = ["set-sp", "set-vtor"]}
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
static_cell = "2"
portable-atomic = { version = "1.5", features = ["critical-section"] }
micromath = "2.1.0"
fixed = "1.28.0"
embassy-futures = "0.1.1"
embedded-hal = "1.0"

embedded-graphics = { version = "0.8.1", features = ["defmt"] }
embedded-hal-bus = { version = "0.3.0", features = ["async"] }

display-driver = { version = "0.1.0", path = "../../display-driver" }
display-driver-spi = { version = "0.1.1", path = "../../buses/spi" }
display-driver-qspi = { version = "0.1.0", path = "../../buses/qspi" }
display-driver-st7735 = { version = "0.1.0", path = "../../panels/st7735" }
display-driver-st7789 = { version = "0.1.0", path = "../../panels/st7789" }
display-driver-gc9a01 = { version = "0.1.0", path = "../../panels/gc9a01" }
display-driver-st77916 = { version = "0.1.0", path = "../../panels/st77916" }
display-driver-co5300 = { version = "0.1.0", path = "../../panels/co5300" }
# tjpgd-rs = { version = "0.1.0", path = "../../../tjpgd-rs" }
tjpgd-rs = { version = "0.1.0", git = "https://github.com/decaday/tjpgd-rs.git", rev = "b2feafee" }


# cargo build/run
[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = true # <-
incremental = false
opt-level = 3 # <-
overflow-checks = true # <-

# cargo test
[profile.test]
codegen-units = 1
debug = 2
debug-assertions = true # <-
incremental = false
opt-level = 3 # <-
overflow-checks = true # <-

# cargo build/run --release
[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false # <-
incremental = false
lto = 'fat'
opt-level = 3 # <-
overflow-checks = false # <-

# cargo test --release
[profile.bench]
codegen-units = 1
debug = 2
debug-assertions = false # <-
incremental = false
lto = 'fat'
opt-level = 3 # <-
overflow-checks = false # <-

[package.metadata.embassy]
build = [
  { target = "thumbv6m-none-eabi", artifact-dir = "out/examples/rp2040" }
]
